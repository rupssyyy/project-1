<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090c1c" />
    <meta name="description" content="Get in touch with Hello, world!" />
    <title>Contact · Hello, world!</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="orb one"></div><div class="orb two"></div><div class="orb three"></div>
    <header class="site-header">
      <a class="brand" href="index.html">Hello, world!</a>
      <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
    </header>
    <main class="page-shell two-column">
      <section class="content-card">
        <div class="eyebrow"><span class="spark"></span> Get in touch</div>
        <h1>Let’s make<br />something.</h1>
        <p>Have an idea, a question, or just a hello? Send a note and we’ll be glad to hear from you.</p>
      </section>
      <section class="content-card">
        <form id="contact-form">
          <label>Name<input name="name" autocomplete="name" placeholder="Your name" required /></label>
          <label>Email<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required /></label>
          <label>Message<textarea name="message" placeholder="What’s on your mind?" required></textarea></label>
          <button type="submit">Send message</button>
          <p class="form-status" id="form-status" aria-live="polite"></p>
        </form>
      </section>
    </main>
    <script>
      document.querySelector("#contact-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#form-status").textContent = "Thanks for reaching out — your message is ready to send!";
        event.currentTarget.reset();
      });
    </script>
  </body>
</html>
