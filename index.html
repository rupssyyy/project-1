<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090c1c" />
    <title>Hello, world!</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      :root {
        color-scheme: dark;
        --ink: #f8f8ff;
        --muted: #b9bed7;
        --violet: #8a6cff;
        --cyan: #58e5ff;
        --pink: #ff78c8;
        --panel: rgba(16, 20, 48, 0.66);
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #090c1c;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .orb {
        position: fixed;
        width: 38rem;
        aspect-ratio: 1;
        border-radius: 50%;
        filter: blur(8px);
        opacity: 0.48;
        pointer-events: none;
        animation: drift 14s ease-in-out infinite alternate;
      }

      .orb.one { background: var(--violet); top: -20rem; left: -12rem; }
      .orb.two { background: var(--cyan); bottom: -24rem; right: -14rem; animation-delay: -6s; }
      .orb.three { background: var(--pink); width: 22rem; top: 18%; right: 8%; animation-delay: -10s; }

      main {
        position: relative;
        width: min(92vw, 730px);
        padding: clamp(2rem, 7vw, 5.5rem);
        text-align: center;
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 32px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.38), inset 0 1px rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(22px);
        animation: arrive 800ms cubic-bezier(.2,.8,.2,1) both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        margin: 0 0 1.25rem;
        color: var(--cyan);
        font-size: 0.76rem;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .spark {
        width: 0.65rem;
        height: 0.65rem;
        border-radius: 50%;
        background: currentColor;
        box-shadow: 0 0 15px currentColor;
        animation: pulse 1.8s ease-in-out infinite;
      }

      h1 {
        margin: 0;
        font-size: clamp(3.3rem, 11vw, 7.5rem);
        line-height: 0.95;
        letter-spacing: -0.075em;
        background: linear-gradient(120deg, #fff 12%, var(--cyan) 46%, #d1bdff 72%, var(--pink));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-wrap: balance;
      }

      p {
        max-width: 33rem;
        margin: 1.55rem auto 2.15rem;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.65;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.95rem 1.35rem;
        color: #101326;
        background: linear-gradient(110deg, var(--cyan), #d6d0ff 55%, var(--pink));
        box-shadow: 0 12px 30px rgba(88, 229, 255, 0.22);
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      button:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 18px 38px rgba(255, 120, 200, 0.28); }
      button:active { transform: translateY(0) scale(0.98); }
      button:focus-visible { outline: 3px solid white; outline-offset: 4px; }

      .footer {
        margin: 2.7rem 0 0;
        color: rgba(255, 255, 255, 0.45);
        font-size: 0.78rem;
        letter-spacing: 0.04em;
      }

      @keyframes arrive {
        from { opacity: 0; transform: translateY(26px) scale(0.97); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }

      @keyframes drift {
        to { transform: translate(5rem, 3rem) scale(1.12); }
      }

      @keyframes pulse {
        50% { transform: scale(1.4); opacity: 0.65; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      }
    </style>
  </head>
  <body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>

    <main>
      <header class="site-header">
        <a class="brand" href="index.html">Hello, world!</a>
        <nav aria-label="Main navigation">
          <a href="index.html" aria-current="page">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </header>
      <div class="eyebrow"><span class="spark"></span> A fresh beginning</div>
      <h1>Hello, world!</h1>
      <p>Something beautiful just started. This little page is ready for whatever you want to build next.</p>
      <button type="button" id="hello-button">Say hello back</button>
      <div class="footer" id="message">Made with a little bit of sparkle.</div>
    </main>

    <script>
      const button = document.querySelector("#hello-button");
      const message = document.querySelector("#message");

      button.addEventListener("click", () => {
        message.textContent = "Hello to you too — let’s make something great.";
        button.textContent = "Hello received ✦";
      });
    </script>
  </body>
</html>
